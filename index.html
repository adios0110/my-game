<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>(여기에 내 이름) | 자기소개</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="profile">
    <p class="eyebrow">ABOUT ME</p>
    <h1>(김현후)</h1>
    <p class="intro">(전주대 게임콘텐츠를 다니고 있는 학생입니다.)</p>

    <section class="games" aria-labelledby="games-title">
      <h2 id="games-title">좋아하는 게임</h2>
      <ul class="game-list">
        <li>
          <a href="https://www.minecraft.net/ko-kr" target="_blank" rel="noopener noreferrer">
            <span class="game-name">마인크래프트</span>
            <img class="game-logo" src="https://www.citypng.com/public/uploads/preview/hd-minecraft-logo-transparent-background-701751694772068q54lqpdt1o.png" alt="마인크래프트 로고">
          </a>
        </li>
        <li>
          <a href="https://www.leagueoflegends.com/ko-kr/" target="_blank" rel="noopener noreferrer">
            <span class="game-name">리그 오브 레전드</span>
            <img class="game-logo" src="https://image.pngaaa.com/919/3839919-middle.png" alt="리그 오브 레전드 로고">
          </a>
        </li>
        <li>
          <a href="https://wutheringwaves.kurogames.com/ko/" target="_blank" rel="noopener noreferrer">
            <span class="game-name">명조</span>
            <img class="game-logo wuthering-logo" src="https://wutheringwaves.kurogames.com/static4.0/assets/logo-jp-41f40b01.png" alt="명조 로고">
          </a>
        </li>
      </ul>
    </section>

    <p class="today" id="today-date" aria-live="polite"></p>
  </main>
</body>
</html>
